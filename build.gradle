plugins {
	// 26.2 是不混淆版本，使用 loom-no-remap（无需 remapJar）
	id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
	id 'architectury-plugin' version '3.5-SNAPSHOT'
	id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version + "+" + rootProject.minecraft_version
}

subprojects {
	apply plugin: 'dev.architectury.loom-no-remap'
	apply plugin: 'architectury-plugin'
	apply plugin: 'maven-publish'

	base {
		// 平台后缀由 -$project.name 自动产生（fabric / neoforge）
		archivesName = "$rootProject.archives_name-$project.name"
	}

	repositories {
		maven {
			name = 'JitPack'
			url = 'https://jitpack.io'
			content {
				includeGroup 'com.github.Virtuoel'
			}
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'TerraformersMC'
			url = 'https://maven.terraformersmc.com/'
			content {
				includeGroup 'com.terraformersmc'
			}
		}
	}

	dependencies {
		minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
		it.options.release = 25
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				artifactId = base.archivesName.get()
				from components.java
			}
		}
		repositories {
			// 发布到本地 Maven（build-all-branches.sh publish 用），publishToMavenLocal 亦可达
		}
	}
}
