plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version + "+" + minecraft_version
group = mod_group_id

repositories {
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
        content {
            includeGroup "com.github.Virtuoel"
        }
    }
}

base {
    archivesName = archives_base_name
}

// Minecraft 1.21.1 使用 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge 版本见 gradle.properties
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // KanosConfig：纯 Java 配置库（无 MC/Fabric 依赖），jar-in-jar 打包
    jarJar(implementation("com.github.Virtuoel:KanosConfig:${kanos_config_tag}") {
        // 其 POM 声明的 fabric-loader 传递依赖在 NeoForge 环境无需解析
        exclude group: "net.fabricmc", module: "fabric-loader"
    })
    // dev 运行环境（runClient/runServer）需要 KanosConfig 在 classpath（jar-in-jar 仅最终 jar 生效）；@jar 避免解析 fabric-loader 传递依赖
	// additionalRuntimeClasspath "com.github.Virtuoel:KanosConfig:${kanos_config_tag}@jar"
}

// 展开 src/main/templates 里的 ${} 占位符（neoforge.mods.toml）
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
