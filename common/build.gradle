architectury {
	common(rootProject.enabled_platforms.split(','))
}

dependencies {
	// 仅用于 @Environment 等跨平台标记注解，不依赖 Fabric API
	modImplementation "net.fabricmc:fabric-loader:$rootProject.loader_version"

	// KanosConfig 已 vendor 进 common/src/main/java/virtuoel/kanos_config/（MIT，见同目录 LICENSE），
	// 不再依赖 JitPack 产物 —— 那个 jar 带 fabric.mod.json，NeoForge 会判为 Fabric mod 而拒绝加载。
}
