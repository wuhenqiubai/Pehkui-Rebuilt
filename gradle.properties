# 人类可读的显示名
mod_name=Pehkui Rebuilt
# 许可证
mod_license=MIT
# mod 版本
mod_version=3.8.5
# Maven group（发布时用）
mod_group_id=wuhenqiubai
# jar 归档名（nf 后缀区分 Fabric 版）
archives_base_name=pehkui-rebuilt-nf

# --- 依赖 ---
kanos_config_tag=0.4.1
