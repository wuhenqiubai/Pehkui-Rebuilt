plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
	thirdparty {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
	implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
	implementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"

	// 不指定 configuration：让 Gradle 按消费方属性自动选变体（compileClasspath→apiElements、
	// runtimeClasspath→runtimeElements）。硬编码 apiElements 会导致 runClient 解析 runtimeClasspath 失败。
	common(project(path: ':common')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

	// KanosConfig：编译期依赖（源码 import virtuoel.kanos_config.api），shadowJar 经 thirdparty config 打进 fabric jar。
	// 必须排除它传递带进来的 fabric-loader（KanosConfig 的 POM 声明了 runtime 版 0.14.17）：
	// 否则 shadow 会把旧版 net.fabricmc.loader.* 打进 jar，遮蔽真实 loader 的类，导致
	// FabricLoader 初始化 language adapter 时 NoClassDefFoundError（AccessWidenerVisitor 等）。
	implementation("com.github.Virtuoel:KanosConfig:$rootProject.kanos_config_tag") {
		exclude group: 'net.fabricmc', module: 'fabric-loader'
	}
	thirdparty("com.github.Virtuoel:KanosConfig:$rootProject.kanos_config_tag") {
		exclude group: 'net.fabricmc', module: 'fabric-loader'
	}
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version, minecraft_version: project.minecraft_version
	}
}

// 26.x 未混淆，无 remapJar 任务；shadowJar 是物化产物
jar {
	archiveClassifier = 'dev'
}

shadowJar {
	configurations = [project.configurations.shadowBundle, project.configurations.thirdparty]
	archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
	apiElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
	runtimeElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
}
