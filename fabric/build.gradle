plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
	thirdparty {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
	implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
	implementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"

	// 不指定 configuration：让 Gradle 按消费方属性自动选变体（compileClasspath→apiElements、
	// runtimeClasspath→runtimeElements）。硬编码 apiElements 会导致 runClient 解析 runtimeClasspath 失败。
	common(project(path: ':common')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

	// KanosConfig 已 vendor 进 common/src/main/java/virtuoel/kanos_config/（MIT，见同目录 LICENSE），
	// 不再依赖 JitPack 产物 —— 那个 jar 带 fabric.mod.json，NeoForge 会判为 Fabric mod 而拒绝加载。
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version, minecraft_version: project.minecraft_version
	}
}

// 26.2 未混淆，无 remapJar 任务；shadowJar 是物化产物
jar {
	archiveClassifier = 'dev'
}

shadowJar {
	configurations = [project.configurations.shadowBundle, project.configurations.thirdparty]
	archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
	apiElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
	runtimeElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
}
