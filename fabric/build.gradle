plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common { canBeResolved = true; canBeConsumed = false }
	shadowBundle { canBeResolved = true; canBeConsumed = false }
	thirdparty { canBeResolved = true; canBeConsumed = false }
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:$rootProject.loader_version"
	modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_version"
	modImplementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"

	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

	// KanosConfig 已 vendor 进 common/src/main/java/virtuoel/kanos_config/（MIT，见同目录 LICENSE），
	// 不再依赖 JitPack 产物 —— 那个 jar 带 fabric.mod.json，NeoForge 会判为 Fabric mod 而拒绝加载。
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version, minecraft_version: project.minecraft_version
	}
}

shadowJar {
	exclude 'architectury.common.json'
	configurations = [project.configurations.shadowBundle, project.configurations.thirdparty]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
}

sourcesJar {
	def commonSources = project(':common').sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}
