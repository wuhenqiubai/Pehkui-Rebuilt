plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common
	shadowBundle
	thirdparty
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

dependencies {
	neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

	common(project(path: ':common', configuration: 'apiElements')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

	// KanosConfig：编译期依赖（源码 import virtuoel.kanos_config.api），shadowJar 经 thirdparty config 打进 neoforge jar
	implementation("com.github.Virtuoel:KanosConfig:$rootProject.kanos_config_tag") {
		exclude group: 'net.fabricmc', module: 'fabric-loader'
	}
	thirdparty("com.github.Virtuoel:KanosConfig:$rootProject.kanos_config_tag") {
		exclude group: 'net.fabricmc', module: 'fabric-loader'
	}
}

// 展开 src/main/templates 里的 ${} 占位符（neoforge.mods.toml）
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
		minecraft_version       : project.minecraft_version,
		minecraft_version_range : project.minecraft_version_range,
		neo_version             : project.neoforge_version,
		loader_version_range    : project.loader_version_range,
		mod_id                  : project.mod_id,
		mod_name                : project.mod_name,
		mod_license             : project.mod_license,
		mod_version             : project.mod_version,
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

processResources {
	inputs.property 'version', project.version
	filesMatching('META-INF/neoforge.mods.toml') {
		expand version: inputs.properties.version
	}
}

// 26.2 未混淆，无 remapJar 任务；shadowJar 是物化产物
jar {
	archiveClassifier = 'dev'
}

shadowJar {
	configurations = [project.configurations.shadowBundle, project.configurations.thirdparty]
	archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
	apiElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
	runtimeElements {
		outgoing.artifacts.clear()
		outgoing.artifact(shadowJar)
	}
}
