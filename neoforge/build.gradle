plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common { canBeResolved = true; canBeConsumed = false }
	shadowBundle { canBeResolved = true; canBeConsumed = false }
	thirdparty { canBeResolved = true; canBeConsumed = false }
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

dependencies {
	neoForge "net.neoforged:neoforge:$rootProject.neo_version"

	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

	// KanosConfig 已 vendor 进 common/src/main/java/virtuoel/kanos_config/（MIT，见同目录 LICENSE），
	// 不再依赖 JitPack 产物 —— 那个 jar 带 fabric.mod.json，NeoForge 会判为 Fabric mod 而拒绝加载。
}

processResources {
	var replaceProperties = [
		version                 : project.version,
		minecraft_version       : project.minecraft_version,
		minecraft_version_range : project.minecraft_version_range,
		neo_version             : project.neo_version,
		loader_version_range    : project.loader_version_range,
		mod_id                  : project.mod_id,
		mod_name                : project.mod_name,
		mod_license             : project.mod_license,
	]
	inputs.properties replaceProperties
	filesMatching('META-INF/neoforge.mods.toml') {
		expand replaceProperties
	}
}

shadowJar {
	exclude 'fabric.mod.json'
	exclude 'architectury.common.json'
	configurations = [project.configurations.shadowBundle, project.configurations.thirdparty]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
}

sourcesJar {
	// common 的源码树里也有 virtuoel/pehkui/api/ScaleType.java（平台中性的编译占位），
	// 与本平台的完整实现同名。保留本平台那份（先加入者优先），丢弃 common 的占位。
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def commonSources = project(':common').sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}
